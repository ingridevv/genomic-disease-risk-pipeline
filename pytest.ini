[pytest]
# Pytest configuration for HELIOX test suite

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options (when using pytest-cov)
# addopts = --cov=ingestion --cov=plugins --cov-report=html --cov-report=term-missing

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require external services)
    slow: Slow tests
    snowflake: Tests requiring Snowflake connectivity
    quality: Data quality validation tests
