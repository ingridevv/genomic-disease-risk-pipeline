version: 2

models:
  - name: fct_gwas_risk_score
    description: >
      Gold layer fact table containing genetic risk scores (Beta Weights) 
      for Inflammatory Bowel Disease (IBD), specifically Crohn's Disease 
      and Ulcerative Colitis. Data is sourced from the GWAS Catalog 
      and filtered for statistically significant associations.
    config:
      incremental_strategy: merge
    columns:
      - name: variant_id
        description: "Unique variant identifier (e.g., rsID). Primary key of the model."
        tests:
          - unique
          - not_null

      - name: disease_trait
        description: "The clinical condition or phenotype studied (e.g., Crohn's disease)."

      - name: odds_ratio
        description: "Odds ratio associated with the risk allele. Must be greater than 0."

      - name: beta_weight
        description: "Effect size calculated as the natural logarithm of the Odds Ratio (ln(OR))."

      - name: p_value
        description: "Statistical significance level of the association."

      - name: ingestion_date
        description: "The timestamp when the record was processed (used for incremental load control)."