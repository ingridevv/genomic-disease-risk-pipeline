name: dbt-ci

on:
  push:
    branches:
      - main
      - dev
      - refactor/genomic-modular
  pull_request:
  workflow_dispatch:

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    env:
      SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
      SF_USER: ${{ secrets.SF_USER }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_DATABASE: ${{ secrets.SF_DATABASE }}
      SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
      SF_SCHEMA: ${{ secrets.SF_SCHEMA }}
      SF_ROLE: ${{ secrets.SF_ROLE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install dbt-core dbt-snowflake

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          dbt_gwas_etl:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "${SF_ACCOUNT}"
                user: "${SF_USER}"
                password: "${SF_PASSWORD}"
                role: "${SF_ROLE}"
                database: "${SF_DATABASE}"
                warehouse: "${SF_WAREHOUSE}"
                schema: "${SF_SCHEMA}"
                threads: 4
          EOF

      - name: Install dependencies
        run: |
          cd dbt_gwas_etl
          dbt deps

      - name: Validate project (parse)
        run: |
          cd dbt_gwas_etl
          dbt parse

      - name: Run dbt models (CI target)
        run: |
          cd dbt_gwas_etl
          dbt run --target dev --select +tag:ci