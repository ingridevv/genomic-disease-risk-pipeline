[project]
name = "heliox"
version = "0.1.0"
description = "HELIOX: Hereditary Evidence & Loci Integration eXploration - End-to-end data engineering pipeline for genomic disease risk discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.3.0",
    "gcsfs>=2026.3.0",
    "numpy>=2.4.3",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "snowflake-connector-python>=4.3.0",
    "streamlit>=1.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
